<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vinsa Jewels — Catalogue</title>
<meta name="description" content="Vinsa Jewels catalogue — natural & lab-grown diamond engagement rings, wedding bands, necklaces, earrings and bracelets, made in Dubai.">
<meta property="og:title" content="Vinsa Jewels — Catalogue">
<meta property="og:description" content="Made for love. Made in Dubai. Natural & lab-grown diamonds set by hand in 18K gold.">
<meta property="og:image" content="img/home/hero.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preload" as="image" href="img/home/hero.jpg">
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Montserrat:wght@300;400;500&family=Amiri:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Sans+Arabic:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --ink:#161616; --ink-75:rgba(22,22,22,.75); --muted:#6F6B64; --line:#E7E2D8;
  --slate:#2A3936; --slate-2:#1f2b29; --cream:#F5F2EC; --soft:#FAF8F4;
  --serif:'Bodoni Moda',Didot,Georgia,serif; --sans:'Montserrat',Arial,sans-serif;
}
html[dir=rtl]{--serif:'Amiri','Bodoni Moda',serif; --sans:'IBM Plex Sans Arabic','Montserrat',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--ink-75);font-family:var(--sans);font-weight:400;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--serif);font-weight:400;color:var(--ink);margin:0}
.wrap{padding:0 20px;max-width:1360px;margin:0 auto}
[hidden]{display:none!important}
.cap{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:500}
html[dir=rtl] .cap{letter-spacing:.02em;font-size:12.5px}
.upper{text-transform:uppercase}

/* ---------- top bar + header ---------- */
.topbar{background:var(--slate);color:#fff;text-align:center;padding:9px 16px;font-family:var(--serif);font-size:13px;letter-spacing:.04em}
html[dir=rtl] .topbar{font-size:14px;letter-spacing:0}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px;height:68px;min-width:0}
.brand{display:flex;flex-direction:column;line-height:1;white-space:nowrap}
.brand b{font-family:'Bodoni Moda',serif;font-size:26px;letter-spacing:.32em;font-weight:400;color:var(--ink);text-transform:uppercase;margin-inline-end:-.32em}
.brand small{font-family:var(--sans);font-size:8.5px;letter-spacing:.34em;color:var(--muted);margin-top:6px;text-transform:uppercase}
html[dir=rtl] .brand small{letter-spacing:.04em;font-size:11px}
.search{flex:1 1 0;min-width:0;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--line);padding:8px 4px;max-width:380px;margin-inline-start:auto}
.search:focus-within{border-color:var(--ink)}
.search input{flex:1 1 0;width:100%;border:0;outline:0;background:none;min-width:0;font-size:13px}
.search svg{width:15px;height:15px;color:var(--ink);flex:none}
.hbtn{flex:none;display:flex;align-items:center;gap:7px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;padding:10px 14px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap;transition:.2s}
.hbtn:hover,.hbtn.on{background:var(--ink);color:#fff}
.hbtn.lang{font-family:'Amiri',serif;font-size:15px;letter-spacing:0;text-transform:none;padding:6px 14px;font-weight:400}
html[dir=rtl] .hbtn.lang{font-family:'Montserrat',sans-serif;font-size:10.5px;letter-spacing:.18em;padding:10px 14px;font-weight:500}
html[dir=rtl] .hbtn{letter-spacing:.02em;font-size:12.5px}

/* ---------- category nav ---------- */
nav.cats{background:#fff;border-bottom:1px solid var(--line)}
.cats .row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.cats .row::-webkit-scrollbar{display:none}
.cat{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;padding:15px 14px 13px;white-space:nowrap;border-bottom:1px solid transparent;color:var(--muted);transition:color .2s}
html[dir=rtl] .cat{letter-spacing:0;font-size:13.5px}
.cat:hover{color:var(--ink)}
.cat.on{color:var(--ink);border-bottom-color:var(--ink)}
.cat span{font-size:9.5px;color:var(--muted);margin-inline-start:4px;letter-spacing:.05em}

/* ---------- landing: hero ---------- */
.hero{position:relative;height:min(84vh,760px);min-height:520px;overflow:hidden}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% 40%;animation:kb 20s ease-out both}
@keyframes kb{from{transform:scale(1.12)}to{transform:scale(1)}}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(245,242,236,.94) 0%,rgba(245,242,236,.6) 38%,rgba(245,242,236,0) 64%)}
html[dir=rtl] .hero::after{background:linear-gradient(270deg,rgba(245,242,236,.94) 0%,rgba(245,242,236,.6) 38%,rgba(245,242,236,0) 64%)}
html[dir=rtl] .hero img{transform:scaleX(-1);animation:kbr 20s ease-out both}
@keyframes kbr{from{transform:scaleX(-1) scale(1.12)}to{transform:scaleX(-1) scale(1)}}
.hero .in{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:center;gap:18px;max-width:1360px;margin:0 auto;padding:0 20px}
.hero h1{font-size:clamp(40px,6.2vw,86px);line-height:.98;text-transform:uppercase;letter-spacing:.01em;max-width:12ch}
html[dir=rtl] .hero h1{line-height:1.25;font-size:clamp(40px,5.6vw,76px)}
.hero .it{font-family:var(--serif);font-style:italic;font-size:clamp(17px,1.6vw,21px);color:var(--ink)}
.btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 26px;border:1px solid var(--ink);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--ink);transition:.25s;background:transparent;text-decoration:none}
html[dir=rtl] .btn{letter-spacing:.02em;font-size:13px}
.btn:hover,.btn.fill{background:var(--ink);color:#fff}
.btn.fill:hover{background:transparent;color:var(--ink)}
.btn svg{width:15px;height:15px}
@media(max-width:760px){
  .hero{height:auto;min-height:0}
  .hero img{position:relative;height:60vh;object-position:78% 30%}
  html[dir=rtl] .hero img{object-position:78% 30%;transform:none;animation:kb 20s ease-out both}
  .hero::after{display:none}
  .hero .in{padding:28px 20px 36px;background:var(--cream)}
}

/* marquee */
.marq{border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:15px 0;background:#fff;direction:ltr}
.marq div{display:inline-block;animation:mq 40s linear infinite}
.marq span{font-family:var(--serif);font-size:15px;color:var(--ink);margin:0 26px}
.marq i{font-style:normal;color:#bdb6a8;font-size:11px}
@keyframes mq{to{transform:translateX(-50%)}}

/* sections */
.sec{padding:84px 0}
.sec.cream{background:var(--cream)}
.head{text-align:center;margin-bottom:38px}
.head h2{font-size:clamp(26px,3vw,38px);text-transform:uppercase;letter-spacing:.02em}
html[dir=rtl] .head h2{letter-spacing:0}
.head p{font-family:var(--serif);font-style:italic;font-size:17px;color:var(--muted);margin:10px 0 0}
@media(max-width:760px){.sec{padding:60px 0}}

/* new in rail */
.railwrap{position:relative}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 20px 8px;scrollbar-width:none;max-width:1360px;margin:0 auto}
.rail::-webkit-scrollbar{display:none}
.pc{flex:0 0 clamp(200px,22vw,280px);scroll-snap-align:start;text-align:start}
.pc .ph{aspect-ratio:1;background:#fff;border:1px solid var(--line);position:relative;overflow:hidden;transition:.3s}
.pc .ph img{width:100%;height:100%;object-fit:contain;padding:8%;transition:transform .6s}
.pc:hover .ph{border-color:var(--ink)}.pc:hover img{transform:scale(1.05)}
.pc .new{position:absolute;top:10px;inset-inline-start:10px;font-size:9px;letter-spacing:.2em;background:var(--slate);color:#fff;padding:4px 8px;font-weight:500}
.pc h3{font-size:16px;margin-top:12px;line-height:1.25}
.pc .pr{font-size:12px;margin-top:6px;letter-spacing:.04em;color:var(--ink)}
.railnav{display:flex;gap:8px;justify-content:center;margin-top:22px}
.railnav button{width:42px;height:42px;border:1px solid var(--ink);display:grid;place-items:center;transition:.2s}
.railnav button:hover{background:var(--ink);color:#fff}
.railnav svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5}
html[dir=rtl] .railnav svg{transform:scaleX(-1)}

/* shapes */
.shapes{position:relative;max-width:1100px;margin:0 auto}
.shapes img{width:100%;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
.hot .ring{width:clamp(70px,11vw,140px);aspect-ratio:1;border-radius:50%;border:1px solid transparent;transition:.25s}
.hot:hover .ring{border-color:rgba(22,22,22,.55)}
.hot span{position:absolute;top:100%;font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;color:var(--ink);background:rgba(255,255,255,.9);padding:5px 10px;opacity:0;transform:translateY(6px);transition:.25s;white-space:nowrap}
html[dir=rtl] .hot span{letter-spacing:0;font-size:12.5px}
.shapes:hover .hot span{opacity:1;transform:none}
.shape-list{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.shape-list a{border:1px solid var(--ink);padding:10px 16px;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;font-weight:500;color:var(--ink);transition:.2s}
html[dir=rtl] .shape-list a{letter-spacing:0;font-size:13px}
.shape-list a:hover{background:var(--ink);color:#fff}
@media(hover:none){.hot span{display:none}}

/* category tiles */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(min-width:1000px){.tiles{grid-template-columns:repeat(4,1fr)}.tiles .tile:nth-child(1),.tiles .tile:nth-child(2){grid-column:span 2;aspect-ratio:4/3}.tiles .tile:nth-last-child(-n+2){grid-column:span 2;aspect-ratio:3/2}}
@media(max-width:700px){.tiles{grid-template-columns:repeat(2,1fr);gap:10px}}
.tile{position:relative;aspect-ratio:3/4;overflow:hidden;display:block;background:var(--cream)}
.tile img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.tile.prod img{object-fit:contain;padding:12%;background:#fff}
.tile:hover img{transform:scale(1.06)}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.5),rgba(0,0,0,0) 46%);pointer-events:none}
.tile.prod{background:#fff;border:1px solid var(--line)}.tile.prod::after{display:none}.tile.prod .lab,.tile.prod .lab h3{color:var(--ink)}.tile.prod .lab span{border-color:var(--ink)}
.tile .lab{position:absolute;inset-inline:0;bottom:22px;z-index:2;text-align:center;color:#fff;padding:0 10px}
.tile .lab h3{color:#fff;font-size:clamp(17px,1.8vw,25px);text-transform:uppercase;letter-spacing:.04em;line-height:1.15}
html[dir=rtl] .tile .lab h3{letter-spacing:0}
.tile .lab span{display:inline-block;margin-top:9px;border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:3px}
.tile.all{background:var(--slate);display:grid;place-items:center;text-align:center;color:#fff}
.tile.all::after{display:none}
.tile.all b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(40px,5vw,64px);color:#fff}
.tile.all .cap{color:rgba(255,255,255,.75)}
.tile.all em{display:inline-block;margin-top:18px;font-style:normal;border:1px solid rgba(255,255,255,.6);padding:11px 18px}

/* editorial mosaic */
.edit{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;height:min(80vw,820px)}
.edit a{position:relative;overflow:hidden;display:block}
.edit a:first-child{grid-row:span 2}.edit a:nth-child(2){grid-column:span 2}
.edit img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.edit a:hover img{transform:scale(1.05)}
.edit .lab{position:absolute;inset-inline-start:18px;bottom:16px;color:#fff;z-index:2}
.edit .lab span{border-bottom:1px solid rgba(255,255,255,.7);padding-bottom:3px}
.edit a::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.4),rgba(0,0,0,0) 35%)}
@media(max-width:760px){.edit{grid-template-columns:1fr 1fr;grid-template-rows:auto;height:auto}.edit a{aspect-ratio:4/5}.edit a:first-child,.edit a:nth-child(2){grid-column:span 2;grid-row:auto;aspect-ratio:1}}

/* split */
.split{display:grid;grid-template-columns:1fr 1fr;background:var(--cream)}
.split img{width:100%;height:100%;object-fit:cover;min-height:480px;display:block}
.split .tx{padding:clamp(36px,6vw,90px);display:flex;flex-direction:column;justify-content:center;gap:22px}
.split h2{font-size:clamp(28px,3.2vw,44px);text-transform:uppercase;line-height:1.05}
html[dir=rtl] .split h2{line-height:1.35}
.split .it{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);line-height:1.5}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:20px 28px;border-top:1px solid #d9d2c4;padding-top:24px}
.facts b{display:block;font-family:var(--serif);font-weight:400;font-size:19px;color:var(--ink);margin-bottom:4px}
.facts span{font-size:13px;line-height:1.6}
@media(max-width:820px){.split{grid-template-columns:1fr}.split img{min-height:0;aspect-ratio:1}}

/* ---------- catalogue ---------- */
.crumbs{display:flex;align-items:baseline;gap:12px;padding:30px 0 6px;color:var(--muted)}
.crumbs a{color:var(--ink)}
.crumbs h2{font-size:clamp(28px,3vw,38px);text-transform:uppercase;letter-spacing:.02em}
html[dir=rtl] .crumbs h2{letter-spacing:0}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:14px 0 22px;border-bottom:1px solid var(--line);margin-bottom:28px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:0;padding:9px 32px 9px 14px;background:#fff;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:500;max-width:240px;color:var(--ink)}
html[dir=rtl] .sel select{padding:9px 14px 9px 32px;letter-spacing:0;font-size:13px;text-transform:none}
.sel::after{content:"";position:absolute;inset-inline-end:13px;top:50%;width:6px;height:6px;border-inline-end:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:translateY(-70%) rotate(45deg);pointer-events:none}
html[dir=rtl] .sel::after{transform:translateY(-70%) rotate(-45deg)}
.sel.active select{border-color:var(--ink);background:var(--cream)}
.count{margin-inline-start:auto;font-size:11px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
html[dir=rtl] .count{letter-spacing:0;font-size:13px}
.clear{font-size:11px;color:var(--ink);text-decoration:underline;text-underline-offset:3px;letter-spacing:.08em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:30px 14px;padding:0 0 50px}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:44px 24px}}
.card{display:flex;flex-direction:column;gap:10px;text-align:start}
.ph{position:relative;aspect-ratio:1;background:#fff;border:1px solid var(--line);overflow:hidden;transition:border-color .25s}
.card:hover .ph{border-color:var(--ink)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;padding:7%;transition:opacity .45s,transform .7s;background:#fff}
.ph img.alt{opacity:0}
.card:hover .ph img.alt{opacity:1}
.card:hover .ph img:not(.alt){transform:scale(1.04)}
.fav{position:absolute;top:9px;inset-inline-end:9px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center;opacity:0;transition:opacity .2s;z-index:2}
.card:hover .fav,.fav.on{opacity:1}
.fav svg{width:15px;height:15px;fill:none;stroke:var(--ink);stroke-width:1.5}
.fav.on svg{fill:var(--ink)}
.ph .n{position:absolute;inset-inline-start:9px;bottom:9px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;background:rgba(255,255,255,.92);padding:3px 7px;color:var(--muted);z-index:2}
.t{font-family:var(--serif);font-size:17px;line-height:1.25;color:var(--ink)}
html[dir=rtl] .t{font-size:18px}
.m{font-size:12px;color:var(--muted);letter-spacing:.03em;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.m .p{color:var(--ink)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;border:1px solid rgba(0,0,0,.14);vertical-align:-1px}
.dot.w{background:#e9e9e6}.dot.y{background:#e2c57a}.dot.r{background:#e6b4a0}.dot.pl{background:#d6d8dc}.dot.tt{background:linear-gradient(90deg,#e9e9e6 50%,#e2c57a 50%)}
.more{display:block;margin:0 auto 70px;padding:14px 32px;border:1px solid var(--ink);color:var(--ink);letter-spacing:.2em;font-size:10.5px;text-transform:uppercase;font-weight:500}
.more:hover{background:var(--ink);color:#fff}
.empty{padding:80px 0;text-align:center;color:var(--muted);font-family:var(--serif);font-size:24px}

/* ---------- lightbox ---------- */
.lb{position:fixed;inset:0;z-index:50;background:rgba(22,22,22,.55);display:none;align-items:center;justify-content:center;padding:0}
.lb.open{display:flex}
.lbox{background:#fff;width:100%;max-width:100%;min-width:0;height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,56vh) minmax(0,1fr);overflow:hidden}
@media(min-width:900px){.lb{padding:28px}.lbox{max-width:1200px;height:min(780px,100%);grid-template-rows:1fr;grid-template-columns:1.25fr 1fr}}
.stage{position:relative;background:#fff;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;border-inline-end:1px solid var(--line)}
.stage img{width:100%;height:100%;max-width:100%;object-fit:contain;padding:4%;background:#fff;touch-action:pan-y}
.arrow{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center}
.arrow svg{width:15px;height:15px;stroke:var(--ink);fill:none;stroke-width:1.5}
.arrow.l{inset-inline-start:12px}.arrow.r{inset-inline-end:12px}
html[dir=rtl] .arrow svg{transform:scaleX(-1)}
.thumbs{position:absolute;inset-inline:0;bottom:10px;display:flex;gap:6px;justify-content:center}
.thumbs button{width:52px;height:52px;border:1px solid var(--line);background:#fff;overflow:hidden;opacity:.7}
.thumbs button.on{opacity:1;border-color:var(--ink)}
.thumbs img{width:100%;height:100%;object-fit:contain}
.info{padding:24px;display:flex;flex-direction:column;gap:14px;overflow:auto;min-width:0}
@media(min-width:900px){.info{padding:40px}}
.info .eyebrow{font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;font-weight:500;color:var(--muted)}
html[dir=rtl] .info .eyebrow{letter-spacing:0;font-size:12.5px}
.info h2{font-family:var(--serif);font-size:30px;line-height:1.15;color:var(--ink)}
.info .price{font-size:19px;color:var(--ink);letter-spacing:.02em}
.info .price small{font-size:10.5px;color:var(--muted);letter-spacing:.12em;margin-inline-start:8px;text-transform:uppercase}
.specs{display:grid;grid-template-columns:auto 1fr;gap:9px 18px;font-size:13px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:16px 0;margin:0}
.specs dt{color:var(--muted);letter-spacing:.14em;text-transform:uppercase;font-size:10px;padding-top:3px;font-weight:500}
html[dir=rtl] .specs dt{letter-spacing:0;font-size:12px}
.specs dd{margin:0;color:var(--ink)}
.desc{font-size:13.5px;line-height:1.75}
.lb .btns{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.lb .btn{width:100%}
.lb .btn.g{background:var(--ink);color:#fff}
.lb .btn.g:hover{background:var(--slate)}
.row2{display:flex;gap:8px}
.row2 .btn{flex:1;padding:11px 8px;font-size:9.5px}
.close{position:absolute;top:10px;inset-inline-end:10px;z-index:2;width:38px;height:38px;background:rgba(255,255,255,.95);border:1px solid var(--line);display:grid;place-items:center}
.close svg{width:15px;height:15px;stroke:var(--ink);stroke-width:1.5}
.navitem{position:absolute;top:10px;inset-inline-start:10px;z-index:2;display:flex;gap:6px}

const fmt=n=>CURRENCY+' '+Math.round(n).toLocaleString('en');
const priceText=it=>!it.price?'':(it.price[0]===it.price[1]?fmt(it.price[0]):fmt(it.price[0])+' – '+fmt(it.price[1]));
const dotCls=m=>/white/i.test(m)?'w':/yellow/i.test(m)?'y':/rose/i.test(m)?'r':/plat/i.test(m)?'pl':'tt';
const metalDots=it=>(it.metals||[]).map(m=>`<i class="dot ${dotCls(m)}" title="${tr('metals',m)}"></i>`).join('');
const catCounts={}; DATA.forEach(it=>catCounts[it.cat]=(catCounts[it.cat]||0)+1);
const cats=CAT_ORDER.filter(c=>catCounts[c]).concat(Object.keys(catCounts).filter(c=>!CAT_ORDER.includes(c)));


/* ---------- landing ---------- */
function renderHome(){
  const m=T.marq.map(x=>`<span>${x}</span><i>✦</i>`).join(''); $('#marq').innerHTML=m+m;
  $('#rail').innerHTML=HOME.newIn.map(id=>DATA.find(x=>x.id===id)).filter(Boolean).map(it=>
    `<a class="pc" href="#p/${it.id}"><div class="ph"><span class="new">${T.newtag.toUpperCase()}</span><img src="${it.img[0].t}" alt="${title(it)}" loading="lazy"></div><h3>${title(it)}</h3><div class="pr">${it.price?fmt(it.price[0]):''}</div></a>`).join('');
  const shapeName=s=>LANG==='ar'?(I18N.ar.shapes[s]||s):s;
  $('#shapes').querySelectorAll('.hot').forEach(e=>e.remove());
  $('#shapes').insertAdjacentHTML('beforeend',HOME.shapes.map(([n,q,x,y])=>`<a class="hot" href="#q/${q}" style="left:${x}%;top:${y}%" aria-label="${shapeName(n)}"><div class="ring"></div><span>${shapeName(n)}</span></a>`).join(''));
  $('#shapelist').innerHTML=HOME.shapes.map(([n,q])=>`<a href="#q/${q}">${shapeName(n)}</a>`).join('');
  $('#tiles').innerHTML=cats.map(c=>{
      const im=HOME.tiles[c]; const it=im?null:(DATA.find(x=>x.id===TILE_PICK[c])||DATA.find(x=>x.cat===c&&x.line==='Vinsa')||DATA.find(x=>x.cat===c));
      return `<a class="tile${im?'':' prod'}" href="#c/${encodeURIComponent(c)}"><img src="${im||it.img[0].t}" alt="${tr('cats',c)}" loading="lazy"><div class="lab"><h3>${tr('cats',c)}</h3><span class="cap">${T.pieces(catCounts[c])}</span></div></a>`;}).join('')
    +`<a class="tile all" href="#all"><div><b>${DATA.length}</b><div class="cap">${T.all}</div><em class="cap">${T.hero_cta1}</em></div></a>`;
  $('#edit').innerHTML=HOME.edit.map(([src,c])=>`<a href="#c/${encodeURIComponent(c)}"><img src="${src}" alt="${tr('cats',c)}" loading="lazy"><div class="lab"><span class="cap">${tr('cats',c)} — ${T.shop}</span></div></a>`).join('');
  $('#facts').innerHTML=T.facts.map(f=>`<div><b>${f[0]}</b><span>${f[1]}</span></div>`).join('');
}
const rail=$('#rail');
$('#railnext').onclick=()=>rail.scrollBy({left:(LANG==='ar'?-1:1)*rail.clientWidth*.8,behavior:'smooth'});
$('#railprev').onclick=()=>rail.scrollBy({left:(LANG==='ar'?1:-1)*rail.clientWidth*.8,behavior:'smooth'});
const rvObs=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');rvObs.unobserve(e.target)}}),{threshold:.1}):null;
document.querySelectorAll('.rv').forEach(el=>rvObs?rvObs.observe(el):el.classList.add('in'));

/* ---------- language ---------- */
function setLang(l){
  LANG=l; T=I18N[l]; document.documentElement.lang=l; document.documentElement.dir=l==='ar'?'rtl':'ltr';
  try{localStorage.setItem('vinsa-lang',l)}catch(e){}
  $('#langbtn').textContent=l==='ar'?'EN':'عربي';
  document.querySelectorAll('[data-i]').forEach(el=>{const v=T[el.dataset.i]; if(typeof v==='string') el.innerHTML=v;});
  $('#q').placeholder=T.search; $('#prevItem').textContent=T.prev; $('#nextItem').textContent=T.next;
  $('#herowa').href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(T.wa_hero)}`;
  $('#fabwa').href=$('#herowa').href;
  $('#viewwa').href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(T.wa_view)}`;
  renderHome();
  $('#cats').innerHTML=`<button class="cat" data-c="">${T.all} <span>${DATA.length}</span></button>`+cats.map(c=>`<button class="cat" data-c="${c}">${tr('cats',c)} <span>${catCounts[c]}</span></button>`).join('');
  $('#f-sort').innerHTML=['','pa','pd','az'].map((v,i)=>`<option value="${v}">${T.sort[i]}</option>`).join('');
  $('#f-sort').value=state.sort;
  document.title=l==='ar'?'فينسا للمجوهرات — الكتالوج':'Vinsa Jewels — Catalogue';
  if(state.view!=='home') render(false);
  if(cur) open(cur.id,true);
}
$('#langbtn').onclick=()=>setLang(LANG==='ar'?'en':'ar');

/* ---------- routing ---------- */
function route(){
  const h=decodeURIComponent(location.hash.slice(1));
  if(cur&&!h.startsWith('p/')) closeLb(false);
  if(h===''||h==='home'){showView('home'); return;}
  if(!h.startsWith('q/')&&!h.startsWith('p/')&&state.q&&(h==='all'||h.startsWith('c/'))){state.q=''; $('#q').value='';}
  if(h==='all'){state.cat=''; state.favs=false; showView('cat'); render(true); return;}
  if(h==='fav'){state.favs=true; state.cat=''; showView('cat'); render(true); return;}
  if(h.startsWith('q/')){state.q=h.slice(2).toLowerCase(); $('#q').value=h.slice(2); state.cat=''; state.favs=false; showView('cat'); render(true); return;}
  if(h.startsWith('c/')){state.cat=h.slice(2); state.favs=false; showView('cat'); render(true); return;}
  if(h.startsWith('p/')){const id=h.slice(2); const it=DATA.find(x=>x.id===id); if(!it) return; if(state.view!=='cat'){state.cat=it.cat; showView('cat'); render(true);} open(id,true); return;}
  showView('home');
}
function showView(v){state.view=v; $('#landing').hidden=v!=='home'; $('#catalogue').hidden=v!=='cat'; $('#catnav').hidden=v!=='cat'; $('#favbtn').classList.toggle('on',state.favs&&v==='cat'); window.scrollTo({top:0});}
window.addEventListener('hashchange',route);
$('#favbtn').onclick=()=>{ if(state.view==='cat'&&state.favs){state.favs=false; location.hash=state.cat?'c/'+encodeURIComponent(state.cat):'all';} else location.hash='fav'; };
$('#cats').addEventListener('click',e=>{const b=e.target.closest('.cat'); if(!b) return; state.sub=''; location.hash=b.dataset.c?'c/'+encodeURIComponent(b.dataset.c):'all';});

/* ---------- filters ---------- */
function fill(sel,vals,label,labelFn){const s=$(sel); const cur=s.value; s.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option value="${v}">${labelFn?labelFn(v):v}</option>`).join(''); s.value=vals.includes(cur)?cur:''; return s.value;}
function refreshSelects(){
  const base=DATA.filter(it=>(!state.cat||it.cat===state.cat));
  state.line=fill('#f-line',[...new Set(base.map(it=>it.line))],T.f_line,v=>T.lines[v]||v);
  state.metal=fill('#f-metal',[...new Set(base.flatMap(it=>it.metals||[]))].sort(),T.f_metal,v=>tr('metals',v));
  state.sub=fill('#f-sub',[...new Set(base.filter(it=>!state.line||it.line===state.line).map(it=>it.sub).filter(Boolean))].sort(),T.f_sub,v=>tr('subs',v));
  ['line','metal','sub','sort'].forEach(k=>$('#w-'+k).classList.toggle('active',!!state[k]));
  $('#clear').hidden=!(state.line||state.metal||state.sub||state.q||state.sort);
}
['#f-line','#f-metal','#f-sub','#f-sort'].forEach(s=>$(s).addEventListener('change',()=>{state.line=$('#f-line').value; state.metal=$('#f-metal').value; state.sub=$('#f-sub').value; state.sort=$('#f-sort').value; render(true);}));
$('#clear').onclick=()=>{state.line=state.metal=state.sub=state.sort=state.q=''; $('#q').value=''; render(true);};
let qt; $('#q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{state.q=e.target.value.trim().toLowerCase(); if(state.view!=='cat'){state.cat=''; showView('cat'); history.replaceState(null,'','#all');} render(true);},120);});

/* ---------- list ---------- */
let list=[];
function compute(){
  const words=state.q.split(/\s+/).filter(Boolean);
  list=DATA.filter(it=>(!state.cat||it.cat===state.cat)&&(!state.line||it.line===state.line)&&(!state.metal||(it.metals||[]).includes(state.metal))&&(!state.sub||it.sub===state.sub)&&(!state.favs||favs.has(it.id))&&words.every(w=>it.hay.includes(w)));
  const L={Vinsa:0,Studio:1,Atelier:2};
  if(state.sort==='pa') list.sort((a,b)=>(a.price?a.price[0]:1e12)-(b.price?b.price[0]:1e12));
  else if(state.sort==='pd') list.sort((a,b)=>(b.price?b.price[1]:-1)-(a.price?a.price[1]:-1));
  else if(state.sort==='az') list.sort((a,b)=>title(a).localeCompare(title(b)));
  else list.sort((a,b)=>(L[a.line]-L[b.line])||a.n-b.n);
}
function card(it){
  const alt=it.img.find(i=>i.k==='model')||(it.img.length>1?it.img[1]:null);
  return `<button class="card" data-id="${it.id}">
    <div class="ph">
      <img src="${it.img[0].t}" alt="${title(it)}" loading="lazy">
      ${alt?`<img class="alt" src="${alt.t}" alt="" loading="lazy">`:''}
      <span class="fav ${favs.has(it.id)?'on':''}" data-fav="${it.id}"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
      ${it.img.length>1?`<span class="n">${it.img.length} ${T.views}</span>`:''}
    </div>
    <div class="t">${title(it)}</div>
    <div class="m">${it.price?`<span class="p">${priceText(it)}</span>`:`<span>${it.shape?tr('shapes',it.shape):tr('subs',it.sub||'')}</span>`}${metalDots(it)}</div>
  </button>`;
}
function render(reset){
  if(reset){state.shown=60; refreshSelects();}
  compute();
  document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('on',b.dataset.c===state.cat&&!state.favs));
  $('#crumb').textContent=state.favs?T.shortlist:(state.cat?tr('cats',state.cat):T.all);
  $('#grid').innerHTML=list.slice(0,state.shown).map(card).join('');
  $('#more').hidden=list.length<=state.shown;
  $('#empty').hidden=list.length>0;
  $('#count').textContent=T.pieces(list.length)+(state.favs?' · '+T.shortlisted:'');
  $('#favbtn').classList.toggle('on',state.favs);
}
$('#more').onclick=()=>{state.shown+=60; render(false);};
$('#grid').addEventListener('click',e=>{
  const f=e.target.closest('[data-fav]'); if(f){e.stopPropagation(); toggleFav(f.dataset.fav); f.classList.toggle('on',favs.has(f.dataset.fav)); return;}
  const c=e.target.closest('.card'); if(c) location.hash='p/'+c.dataset.id;
});
function toggleFav(id){favs.has(id)?favs.delete(id):favs.add(id); saveFavs(); toast(favs.has(id)?T.added:T.removed);}
let tt; function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove('on'),1400);}

/* ---------- lightbox ---------- */
let cur=null, ci=0;
const waLink=it=>`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(T.wa(title(it),(it.skus&&it.skus.length?it.skus.join('/'):it.id),priceText(it)))}`;
function open(id,keepIndex){
  const it=DATA.find(x=>x.id===id); if(!it) return; if(!keepIndex||cur!==it) ci=0; cur=it;
  $('#thumbs').innerHTML=it.img.length>1?it.img.map((im,i)=>`<button data-i="${i}" title="${T.kinds[im.k]||''}"><img src="${im.t}" alt=""></button>`).join(''):'';
  $('#pl').style.display=$('#pr').style.display=it.img.length>1?'':'none';
  $('#info').innerHTML=`
    <div class="eyebrow">${tr('cats',it.cat)}${it.sub&&it.sub!==it.cat?' · '+tr('subs',it.sub):''}</div>
    <h2>${title(it)}</h2>
    ${it.price?`<div class="price">${priceText(it)}<small>${T.vat}</small></div>`:`<div><span class="tag">${T.por}</span></div>`}
    <dl class="specs">
      <dt>${T.line}</dt><dd>${T.lines[it.line]||it.line}</dd>
      ${it.metals&&it.metals.length?`<dt>${T.metal}</dt><dd>${it.metals.map(m=>`<i class="dot ${dotCls(m)}"></i> ${tr('metals',m)}`).join(' &nbsp; ')}</dd>`:''}
      ${it.shape?`<dt>${T.shape}</dt><dd>${tr('shapes',it.shape)}</dd>`:''}
      ${it.carats&&it.carats.length?`<dt>${T.carat}</dt><dd>${it.carats.join(' · ')} ${T.ct}</dd>`:''}
      ${it.origin&&it.origin.length?`<dt>${T.diamond}</dt><dd>${it.origin.map(o=>LANG==='ar'?(/lab/i.test(o)?'ألماس مصنع مخبرياً':/natural/i.test(o)?'ألماس طبيعي':o):o).join(' · ')}</dd>`:''}
      <dt>${T.ref}</dt><dd dir="ltr">${it.skus&&it.skus.length?it.skus.join(' · '):it.id}</dd>
    </dl>
    <div class="desc">${LANG==='en'&&it.desc?it.desc:T.desc}</div>
    <div class="btns">
      <a class="btn g" target="_blank" rel="noopener" href="${waLink(it)}"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.8-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.7 3.1.6a2.6 2.6 0 0 0 1.8-1.2 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.2-.5-.3z"/></svg> ${T.enquire}</a>
      <div class="row2">
        <button class="btn" id="favlb">${favs.has(it.id)?T.faved:T.fav}</button>
        <button class="btn" id="copylb">${T.copy}</button>
        ${it.url?`<a class="btn" target="_blank" rel="noopener" href="${it.url}">${T.online}</a>`:''}
      </div>
    </div>`;
  $('#favlb').onclick=()=>{toggleFav(it.id); $('#favlb').textContent=favs.has(it.id)?T.faved:T.fav; render(false);};
  $('#copylb').onclick=()=>{const u=location.href.split('#')[0]+'#p/'+it.id; (navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>toast(T.copied)).catch(()=>prompt('',u));};
  show(ci); $('#lb').classList.add('open'); document.body.style.overflow='hidden'; document.body.classList.add('lbopen');
}
function show(i){ci=(i+cur.img.length)%cur.img.length; $('#big').src=cur.img[ci].f; $('#big').alt=title(cur); document.querySelectorAll('#thumbs button').forEach((b,j)=>b.classList.toggle('on',j===ci));}
function closeLb(nav=true){ $('#lb').classList.remove('open'); document.body.style.overflow=''; document.body.classList.remove('lbopen'); cur=null; if(nav) history.back(); }
function step(d){const i=list.findIndex(x=>x.id===cur.id); const nx=list[(i+d+list.length)%list.length]; if(nx) history.replaceState(null,'','#p/'+nx.id), open(nx.id);}
$('#close').onclick=()=>closeLb(); $('#lb').addEventListener('click',e=>{if(e.target.id==='lb') closeLb();});
$('#pl').onclick=()=>show(ci-1); $('#pr').onclick=()=>show(ci+1);
$('#prevItem').onclick=()=>step(-1); $('#nextItem').onclick=()=>step(1);
$('#thumbs').addEventListener('click',e=>{const b=e.target.closest('button'); if(b) show(+b.dataset.i);});
document.addEventListener('keydown',e=>{ if(!cur) return; const rtl=LANG==='ar'; if(e.key==='Escape') closeLb(); else if(e.key==='ArrowLeft') (e.shiftKey?step(rtl?1:-1):show(ci+(rtl?1:-1))); else if(e.key==='ArrowRight') (e.shiftKey?step(rtl?-1:1):show(ci+(rtl?-1:1))); });
let tx=null; $('#big').addEventListener('touchstart',e=>tx=e.touches[0].clientX,{passive:true});
$('#big').addEventListener('touchend',e=>{ if(tx===null) return; const dx=e.changedTouches[0].clientX-tx; tx=null; if(Math.abs(dx)>50) (cur.img.length>1?show(ci+(dx<0?1:-1)):step(dx<0?1:-1)); },{passive:true});

/* ---------- boot ---------- */
saveFavs();
let l=DEFAULT_LANG; try{const u=new URLSearchParams(location.search).get('lang'); l=u||localStorage.getItem('vinsa-lang')||DEFAULT_LANG;}catch(e){}
if(!I18N[l]) l='en';
setLang(l); route();
</script>
</body>
</html>
